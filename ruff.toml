required-version = "0.17.5"
target-version = "py310"
line-length = 88

extend-exclude = [
  ".venv",
  "build",
  "dist",
  "*.egg-info",
  "*.md",
]

# Pyflakes plus the pycodestyle error groups for imports, statements, and
# runtime syntax. Mutable class configuration is left out on purpose: several
# catalogs are shared defaults, and a ClassVar annotation would not make a
# later in-place update safe.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# ProviderField imports fields_associations from this module, so the import
# has to follow that assignment.
"django-providerkit/src/django_providerkit/__init__.py" = ["E402"]
# Re-exported for `from django_providerkit.managers import ...`.
"django-providerkit/src/django_providerkit/managers/__init__.py" = ["F401"]
# Initialization imports kept for a separate review. They are not the
# confirmed unused names removed elsewhere.
"django-providerkit/src/django_providerkit/admin/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
skip-magic-trailing-comma = false
